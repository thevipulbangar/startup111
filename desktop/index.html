<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CabScreen Control</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1b1d21; --muted: #6b7280; --line: #e3e5e8;
          --accent: #2563eb; --danger: #dc2626; --ok: #16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --line: #2b2f36;
            --accent: #60a5fa; --danger: #f87171; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 24px 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, .filebtn { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.danger { color: var(--danger); }
  button.go { color: var(--ok); }
  .muted { color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.live { background: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .grid .card { margin: 0; }
  .ride { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ride-state { font-size: 20px; font-weight: 700; }
  .ride-state.on { color: var(--ok); }
  .vid { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .vid .name { overflow-wrap: anywhere; }
  .bold { font-weight: 600; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .tag { font-weight: 600; }
  .START { color: var(--ok); } .END { color: var(--danger); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  progress { width: 220px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>CabScreen Control</h1>
      <span class="muted"><span class="dot" id="dot"></span><span id="status">Connecting…</span></span>
    </div>
    <div class="row">
      <button id="refresh">Refresh</button>
      <button id="clear" class="danger">Clear notifications</button>
    </div>
  </header>

  <h2>Ride</h2>
  <div class="card ride">
    <div>
      <div class="ride-state" id="rideState">…</div>
      <div class="muted" id="rideInfo"></div>
    </div>
    <div class="row">
      <button class="go" id="startRide">▶ Start ride</button>
      <button class="danger" id="endRide">■ End ride</button>
    </div>
  </div>

  <h2>Ad videos <span id="vidCount"></span></h2>
  <div class="card">
    <div class="row">
      <label class="filebtn">⬆ Upload videos<input type="file" id="file" accept="video/*" multiple hidden></label>
      <progress id="prog" max="1" value="0" hidden></progress>
      <span class="muted" id="upMsg">Tablets download new videos automatically and play them in this order.</span>
    </div>
  </div>
  <div id="videos"></div>

  <h2>Cab tablets</h2>
  <div class="grid" id="tablets"><p class="muted">No tablet connected yet.</p></div>

  <h2>Driver phones</h2>
  <div class="grid" id="devices"><p class="muted">No phone has sent anything yet.</p></div>

  <h2>Notifications</h2>
  <div id="list"><p class="muted">Nothing yet. Waiting for the phone…</p></div>
</main>
<script>
const LABEL = { START: "🟢 RIDE STARTED", END: "🔴 RIDE ENDED", OTHER: "⚪ other" };
let all = [];
let videoKey = "";

const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text; // textContent, never innerHTML: messages come from other people
  return e;
}
const deviceName = e => e.device || "Unknown phone";
const when = t => new Date(t).toLocaleString();
const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + "s ago" : Math.round(s / 60) + " min ago"; };
const mb = n => (n / 1048576).toFixed(1) + " MB";
const post = url => fetch(url, { method: "POST" }).then(r => { if (!r.ok) alert("Only works on the laptop running the server (http://localhost:8000)."); });

function card(e) {
  const c = el("div", "card");
  const meta = el("div", "meta");
  meta.append(el("span", "", when(e.time)), el("span", "tag", e.app),
              el("span", "tag " + e.type, LABEL[e.type] || e.type));
  if (e.fare) meta.append(el("span", "tag", "₹" + e.fare));
  meta.append(el("span", "", "📱 " + deviceName(e)));
  c.append(meta, el("div", "bold", e.title), el("div", "text", e.text));
  return c;
}

function renderDevices() {
  const by = new Map();
  for (const e of all) {
    const key = deviceName(e) + "|" + (e.ip || "");
    const d = by.get(key) || { name: deviceName(e), ip: e.ip, android: e.android, count: 0, last: 0, apps: new Set() };
    d.count++; d.last = Math.max(d.last, e.time); d.apps.add(e.app);
    if (e.android) d.android = e.android;
    by.set(key, d);
  }
  const box = $("devices");
  box.replaceChildren();
  if (!by.size) return box.append(el("p", "muted", "No phone has sent anything yet."));
  for (const d of by.values()) {
    const c = el("div", "card");
    c.append(el("div", "bold", "📱 " + d.name),
             el("div", "muted", (d.android ? "Android " + d.android + " · " : "") + "IP " + (d.ip || "?")),
             el("div", "muted", d.count + " notifications · " + [...d.apps].join(", ")),
             el("div", "muted", "Last seen " + when(d.last)));
    box.append(c);
  }
}

// "📍 18.520430, 73.856743 ±12 m · 1 min ago · Open map"
function locationLine(loc) {
  const d = el("div", "muted");
  if (!loc) return d.append("📍 Location not available yet (allow location on the tablet, turn on GPS)"), d;
  const ll = loc.lat.toFixed(6) + ", " + loc.lng.toFixed(6);
  const a = el("a", "", "Open map");
  a.href = "https://www.google.com/maps?q=" + loc.lat + "," + loc.lng;
  a.target = "_blank"; a.rel = "noopener";
  d.append("📍 " + ll + (loc.acc ? " ±" + loc.acc + " m" : "") + (loc.fix ? " · " + ago(loc.fix) : "") + " · ", a);
  return d;
}

function renderState(s) {
  const on = s.ride.active;
  $("rideState").textContent = on ? "🟢 Ride in progress — ads playing" : "⚪ No ride — ads stopped";
  $("rideState").className = "ride-state" + (on ? " on" : "");
  $("rideInfo").textContent = s.ride.since ? (on ? "Started " : "Ended ") + when(s.ride.since) + " · by " + s.ride.source : "";
  $("startRide").disabled = on;
  $("endRide").disabled = !on;

  const key = JSON.stringify(s.videos);
  if (key !== videoKey) {
    videoKey = key;
    $("vidCount").textContent = "(" + s.videos.length + ")";
    const box = $("videos");
    box.replaceChildren();
    if (!s.videos.length) box.append(el("p", "muted", "No videos yet. Upload one above."));
    s.videos.forEach((v, i) => {
      const c = el("div", "card vid");
      const left = el("div");
      left.append(el("div", "name bold", (i + 1) + ". " + v.name), el("div", "muted", mb(v.size)));
      const del = el("button", "danger", "Delete");
      del.onclick = () => confirm("Delete " + v.name + "? Tablets will remove it too.") && post("/delete?name=" + encodeURIComponent(v.name));
      c.append(left, del);
      box.append(c);
    });
  }

  const tb = $("tablets");
  tb.replaceChildren();
  const list = Object.entries(s.tablets);
  if (!list.length) tb.append(el("p", "muted", "No tablet connected yet."));
  for (const [ip, t] of list) {
    const online = Date.now() - t.seen < 5000;
    const c = el("div", "card");
    c.append(el("div", "bold", (online ? "🟢 " : "🔴 ") + "📺 " + t.name),
             el("div", "muted", "IP " + ip + " · " + (online ? "online" : "offline, last seen " + ago(t.seen))),
             el("div", "muted", t.playing ? "▶ Playing " + t.playing : "Idle"));
    c.append(locationLine(t.loc));
    tb.append(c);
  }
}

async function load() {
  try {
    const [res, state] = await Promise.all([
      fetch("/events?since=" + all.length, { cache: "no-store" }).then(r => r.json()),
      fetch("/state", { cache: "no-store" }).then(r => r.json()),
    ]);
    const list = $("list");
    if (res.total < all.length) {
      all = [];
      list.replaceChildren(el("p", "muted", "Nothing yet. Waiting for the phone…"));
    } else if (res.events.length) {
      if (!all.length) list.replaceChildren();
      for (const e of res.events) list.prepend(card(e));
      all.push(...res.events);
    }
    renderDevices();
    renderState(state);
    $("dot").className = "dot live";
    $("status").textContent = all.length + " notifications · live";
  } catch {
    $("dot").className = "dot";
    $("status").textContent = "Server not reachable";
  }
  setTimeout(load, 1000);
}

// Upload one file at a time with progress; the server streams it straight to disk.
$("file").onchange = async e => {
  const files = [...e.target.files];
  e.target.value = "";
  for (const [i, f] of files.entries()) {
    $("prog").hidden = false;
    $("upMsg").textContent = `Uploading ${f.name} (${i + 1}/${files.length})…`;
    const ok = await new Promise(resolve => {
      const x = new XMLHttpRequest();
      x.open("POST", "/upload");
      x.setRequestHeader("X-Filename", encodeURIComponent(f.name));
      x.upload.onprogress = p => { $("prog").value = p.loaded / p.total; };
      x.onload = () => resolve(x.status === 200 ? true : x.statusText || "error " + x.status);
      x.onerror = () => resolve("network error");
      x.send(f);
    });
    if (ok !== true) alert("Upload failed for " + f.name + ": " + ok);
  }
  $("prog").hidden = true;
  $("upMsg").textContent = "Done. Tablets download new videos automatically.";
};

$("startRide").onclick = () => post("/ride?state=start");
$("endRide").onclick = () => post("/ride?state=end");
$("refresh").onclick = () => location.reload();
$("clear").onclick = () => confirm("Delete all notifications saved on this laptop?") && post("/clear");
load();
</script>
</body>
</html>
